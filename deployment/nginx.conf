limit_req_zone $binary_remote_addr zone=ecdat_api:10m rate=10r/s;
upstream ecdat_backend { server backend:8000; }
upstream ecdat_frontend { server frontend:80; }

server {
    listen 8080;
    server_tokens off;
    client_max_body_size 50m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location ~ ^/(api|health|docs|redoc) {
        limit_req zone=ecdat_api burst=30 nodelay;
        proxy_pass http://ecdat_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://ecdat_frontend;
        proxy_set_header Host $host;
    }
}
