services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecdat}
      POSTGRES_USER: ${POSTGRES_USER:-ecdat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [data]

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '$${NEO4J_AUTH#*/}' 'RETURN 1' >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 15
    networks: [data]

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: production
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ecdat_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ecdat}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ECDAT_ENVIRONMENT: production
      ECDAT_SECRET_KEY: ${ECDAT_SECRET_KEY:?set ECDAT_SECRET_KEY}
      ECDAT_CORS_ORIGINS: ${ECDAT_CORS_ORIGINS:?set ECDAT_CORS_ORIGINS}
      ECDAT_SEED_DEMO: ${ECDAT_SEED_DEMO:-false}
      ECDAT_DOCKER_ENABLED: ${ECDAT_DOCKER_ENABLED:-false}
      ECDAT_SCAN_STORAGE_PATH: /app/scan-data
    volumes: [scan_data:/app/scan-data]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    networks: [app, data]

  frontend:
    build:
      context: ../frontend
      target: production
      args: {VITE_API_URL: ""}
    restart: unless-stopped
    networks: [app]

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${ECDAT_HTTP_PORT:-8080}:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend, frontend]
    networks: [app]

volumes:
  postgres_data:
  neo4j_data:
  scan_data:
networks:
  app:
  data:
    internal: true
