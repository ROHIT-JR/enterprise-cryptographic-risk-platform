[project]
name = "ecdat-x"
version = "0.3.0"
description = "Enterprise Cryptographic Discovery, Analysis & Transformation Platform"
requires-python = ">=3.11"

dependencies = [
    "networkx==3.4.2",
    "numpy==2.2.3",
    "scipy==1.15.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["frontend", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
