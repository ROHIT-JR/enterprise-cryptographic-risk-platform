services:
  - type: web
    name: ecdat-x-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    dockerCommand: "./backend/start.sh"
    healthCheckPath: /health
    envVars:
      - key: ECDAT_ENVIRONMENT
        value: production
      - key: ECDAT_SEED_DEMO
        value: "false"
      - key: ECDAT_DOCKER_ENABLED
        value: "false"
      - key: ECDAT_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: ECDAT_CORS_ORIGINS
        sync: false
