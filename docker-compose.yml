services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecdat}
      POSTGRES_USER: ${POSTGRES_USER:-ecdat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecdat_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [ecdat]

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -u neo4j -p "$${NEO4J_AUTH#*/}" "RETURN 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [ecdat]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    restart: unless-stopped
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://ecdat_user:ecdat_password@postgres:5432/ecdat}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      ECDAT_ENVIRONMENT: development
      ECDAT_NEO4J_ENABLED: "true"
      ECDAT_CORS_ORIGINS: ${ECDAT_CORS_ORIGINS:-http://localhost:5173}
      ECDAT_TLS_ALLOW_PRIVATE_TARGETS: ${ECDAT_TLS_ALLOW_PRIVATE_TARGETS:-false}
      ECDAT_SEED_DEMO: ${ECDAT_SEED_DEMO:-true}
      ECDAT_ADMIN_USERNAME: ${ECDAT_ADMIN_USERNAME:-}
      ECDAT_ADMIN_PASSWORD: ${ECDAT_ADMIN_PASSWORD:-}
      ECDAT_SCAN_STORAGE_PATH: /app/scan-data
    volumes:
      - ./backend:/app/backend
      - ./scanners:/app/scanners
      - ./cbom_engine:/app/cbom_engine
      - ./knowledge_graph:/app/knowledge_graph
      - ./risk_engine:/app/risk_engine
      - ./graph_analysis:/app/graph_analysis
      - ./migration_engine:/app/migration_engine
      - ./lifecycle_engine:/app/lifecycle_engine
      - ./benchmarks:/app/benchmarks
      - ./config:/app/config
      - scan_data:/app/scan-data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - ${DOCKER_GID:-999}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ecdat]

  frontend:
    build:
      context: ./frontend
      target: development
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [ecdat]

volumes:
  postgres_data:
  neo4j_data:
  scan_data:
  frontend_node_modules:

networks:
  ecdat:
    driver: bridge
